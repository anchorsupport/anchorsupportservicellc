name: Verify and deploy static content to Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Build and QA public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site QA tools
        run: python -m pip install -r .github/site-tools/requirements-ci.txt

      - name: Install Chromium for responsive QA
        run: python -m playwright install --with-deps chromium

      - name: Build allowlisted Pages directory
        run: python .github/site-tools/build_site.py

      - name: Run responsive, links, Careers status, and privacy QA
        run: python .github/site-tools/website_qa.py --root dist/public-site

      - name: Save verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-site
          path: dist/public-site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy verified site
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-static-site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying a transient Pages artifact lookup failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Retry GitHub Pages deployment once
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
